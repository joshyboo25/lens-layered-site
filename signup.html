<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up – Lens & Layered Designs</title>
  <link rel="icon" href="logo/lenslogo.png" />
  <link rel="stylesheet" href="assets/css/dashboard.css" />

  <style>
    /* Reset + Centering */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #000;
      overflow: hidden;
      position: relative;
      color: #fff;
    }

    /* Background slideshow */
    .slideshow-bg {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
    }

    .slideshow-bg img {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      animation: fadeCycle 50s infinite;
    }

    .slideshow-bg img:nth-child(1) { animation-delay: 0s; }
    .slideshow-bg img:nth-child(2) { animation-delay: 10s; }
    .slideshow-bg img:nth-child(3) { animation-delay: 20s; }
    .slideshow-bg img:nth-child(4) { animation-delay: 30s; }
    .slideshow-bg img:nth-child(5) { animation-delay: 40s; }

    @keyframes fadeCycle {
      0% { opacity: 0; }
      5% { opacity: 1; }
      20% { opacity: 1; }
      25% { opacity: 0; }
      100% { opacity: 0; }
    }

    /* Auth container */
    .auth-container {
      background: rgba(0, 0, 0, 0.85);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .auth-logo img {
      max-width: 80px;
      display: block;
      margin: 0 auto 1rem;
    }

    h2 {
      margin-bottom: 1.5rem;
      font-size: 1.75rem;
    }

    input {
      width: 100%;
      padding: 0.75rem;
      margin: 0.75rem 0;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 1rem;
      transition: border 0.3s ease, box-shadow 0.3s ease;
    }

    input:focus {
      outline: none;
      border-color: #ff5733;
      box-shadow: 0 0 5px rgba(255, 87, 51, 0.5);
    }

    button {
      width: 100%;
      padding: 0.75rem;
      margin-top: 1rem;
      background-color: #ff5733;
      color: white;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #e64a28;
    }

    a {
      color: #ff5733;
      text-decoration: none;
    }

    /* Mobile tweaks */
    @media (max-width: 480px) {
      .auth-container {
        padding: 1.5rem 1rem;
        margin: 2rem 1rem;
      }
      input,
      button {
        font-size: 0.95rem;
        padding: 0.6rem;
      }
    }
  </style>
</head>

<body>

<!-- Background Slideshow -->
<div class="slideshow-bg">
  <img src="slides/test1.jpg" alt="Slide 1">
  <img src="slides/test2.jpg" alt="Slide 2">
  <img src="slides/test3.jpg" alt="Slide 3">
  <img src="slides/test4.jpg" alt="Slide 4">
  <img src="slides/test5.jpg" alt="Slide 5">
</div>

<!-- Auth Form -->
<div class="auth-container">
  <div class="auth-logo">
    <img src="logo/lenslogo.png" alt="Lens & Layered Logo" />
  </div>
  <h2>Create Account</h2>

  <form id="signup-form">
    <input type="text" id="signup-username" placeholder="Name" required />
    <input type="email" id="signup-email" placeholder="Email" required />
    <input type="password" id="signup-password" placeholder="Password" required autocomplete="new-password" />
    <button id="signup-btn" type="submit">Sign Up</button>
  </form>

  <p style="margin-top: 1rem;">
    <a href="login.html">Already have an account? Log in</a>
  </p>
</div>

<script type="module">
import auth from './services/auth.js'; // Adjust path if needed

// Toast Logic
function showToast(message, type = "success") {
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = message;
  document.body.appendChild(toast);

  setTimeout(() => {
    toast.classList.add('show');
  }, 100);

  setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => {
      if (toast.classList.contains('error')) {
        toast.classList.add('shake');
      }
      toast.remove();
    }, 300);
  }, 3000);
}


const funnySignupErrors = [
  "💀 Whoa there buddy, signup failed.",
  "📛 You broke it already? Try again.",
  "🚫 That username probably cursed the server.",
  "🙅‍♂️ System rejected your vibes. Retry.",
  "🛑 Signup gone wrong, Netflix doc incoming."
];

function randomFunnySignupError() {
  const index = Math.floor(Math.random() * funnySignupErrors.length);
  return funnySignupErrors[index];
}

document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('signup-form');
  const signupBtn = document.getElementById('signup-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const username = document.getElementById('signup-username').value.trim();
    const email = document.getElementById('signup-email').value.trim().toLowerCase();
    const password = document.getElementById('signup-password').value;

    if (!username || !email || !password) {
      showToast("⚠️ All fields are required.", "error");
      return;
    }

    signupBtn.disabled = true;
    signupBtn.textContent = "Signing up...";

    try {
      await auth.signupUser(username, email, password);
      showToast("✅ Account created! Redirecting to login...", "success");
      setTimeout(() => {
        window.location.href = 'login.html'; // ✅ relative path
      }, 1500); // Give user a second to see the toast
    } catch (error) {
      console.error(error);
      showToast(randomFunnySignupError(), "error");
    } finally {
      signupBtn.disabled = false;
      signupBtn.textContent = "Sign Up";
    }
  });
});
</script>


</body>
</html>
