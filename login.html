<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Lens&LayeredDesigns</title>
  <link rel="icon" href="logo/lenslogo.png" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      position: relative;
      background: #000;
      color: #fff;
    }

    .slideshow-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    .slideshow-bg img {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      animation: fade 50s infinite;
    }

    .slideshow-bg img:nth-child(1) { animation-delay: 0s; }
    .slideshow-bg img:nth-child(2) { animation-delay: 10s; }
    .slideshow-bg img:nth-child(3) { animation-delay: 20s; }
    .slideshow-bg img:nth-child(4) { animation-delay: 30s; }
    .slideshow-bg img:nth-child(5) { animation-delay: 40s; }

    @keyframes fade {
      0%   { opacity: 0; }
      5%   { opacity: 1; }
      20%  { opacity: 1; }
      25%  { opacity: 0; }
      100% { opacity: 0; }
    }

    .auth-container {
      max-width: 400px;
      width: 90%;
      padding: 2rem;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(15px) saturate(160%);
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      text-align: center;
      z-index: 2;
    }

    .auth-container h2 {
      margin-bottom: 1.5rem;
      font-size: 1.75rem;
    }

    .auth-container input {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      transition: border 0.3s ease, box-shadow 0.3s ease;
    }

    .auth-container input:focus {
      outline: none;
      border: 1px solid #ff5733;
      box-shadow: 0 0 5px rgba(255, 87, 51, 0.4);
    }

    .auth-container button {
      width: 100%;
      padding: 0.75rem;
      background: #ff5733;
      border: none;
      color: white;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .auth-container button:hover {
      background: #e04a2c;
    }

    .auth-container a {
      display: block;
      margin-top: 1rem;
      color: #a0d8ff;
      text-decoration: none;
    }

    .logo-overlay {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
    }

    .logo-overlay img {
      width: 80px;
      border-radius: 8px;
    }

    @media (max-width: 480px) {
      .auth-container {
        padding: 1.5rem 1rem;
      }

      .auth-container input,
      .auth-container button {
        font-size: 0.95rem;
        padding: 0.6rem;
      }

      .logo-overlay {
        top: 15px;
      }
    }
  </style>
</head>
<body>

  <div class="logo-overlay">
    <img src="logo/lenslogo.png" alt="Lens&Layered Logo" />
  </div>

  <div class="slideshow-bg">
    <img src="slides/test8.jpg" alt="slide1">
    <img src="slides/test9.jpg" alt="slide2">
    <img src="slides/test6.jpg" alt="slide3">
    <img src="slides/test7.jpg" alt="slide4">
    <img src="slides/test10.jpg" alt="slide5">
  </div>

  <div class="auth-container">
    <h2>Log In</h2>
    <input type="email" id="login-email" placeholder="Email" required />
    <input type="password" id="login-password" placeholder="Password" required />
    <button onclick="login()">Log In</button>
    <a href="signup.html">Need an account? Sign up</a>
  </div>

  <script>
  async function login() {
    const email = document.getElementById('login-email').value.trim().toLowerCase();
    const password = document.getElementById('login-password').value;
    const loginBtn = document.querySelector("button");

    if (!email || !password) {
      alert('Please enter both email and password.');
      return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = "Logging in...";

    const backendURL = window.location.hostname.includes("localhost")
      ? "http://localhost:5000"
      : "https://lens-backend-73wi.onrender.com";

    try {
      const response = await fetch(`${backendURL}/api/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });

      const contentType = response.headers.get('content-type');

      if (contentType && contentType.includes('application/json')) {
        const data = await response.json();

        if (response.ok && data.token) {
          localStorage.setItem('authToken', data.token);
          alert(`Welcome back!`);
          window.location.href = 'dashboard.html';
        } else {
          throw new Error(data.message || "Login failed.");
        }
      } else {
        const text = await response.text();
        throw new Error(`Unexpected response: ${text}`);
      }
    } catch (err) {
      console.error("❌ Login error:", err);
      alert("Login failed: " + err.message);
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = "Log In";
    }
  }
</script>


</body>
</html>
