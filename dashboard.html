<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Dashboard – Lens & Layered Designs</title>
  <link rel="icon" href="logo/lenslogo.png" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/dashboard.css" />
  <style>
    /* Lightbox styles */
    .lightbox {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .lightbox-img {
      max-width: 90%;
      max-height: 85%;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 30px;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header class="site-header">
  <img src="logo/lenslogo.png" alt="Lens&Layered Logo" class="site-logo" />
  <h1 class="site-title">User Dashboard</h1>
  <button class="logout-btn" id="logout-btn">Logout</button>
  <button class="home-btn" id="home-btn">Home</button>
</header>

<main class="dashboard-container">
  <aside class="sidebar">
    <ul>
      <li><a href="#overview" class="active">📊 Overview</a></li>
      <li><a href="#uploads">📁 Uploads</a></li>
      <li><a href="profile.html">👤 Profile</a></li>
      <li><a href="about.html">⚙ Contribute</a></li>
    </ul>
  </aside>

  <section class="dashboard-content">
    <h2>Welcome back, <span id="username">User</span> 👋</h2>

    <div class="dashboard-widgets">
      <div class="upload-form">
        <h3>📤 Upload New Image</h3>
        <input type="file" id="uploadInput" accept="image/*" />
        <button class="logout-btn" id="upload-btn">Upload</button>
      </div>
      <div class="widget">Total Uploads:<strong id="uploadCount">0</strong></div>
      <div class="widget">Followers:<strong id="followerCount">--</strong></div>
      <div class="widget">Last Login:<strong id="lastLogin">--</strong></div>
    </div>

    <div class="dashboard-section" id="uploads">
      <h3>📁 Your Uploads</h3>
      <p>Here's a quick look at your latest photos.</p>
      <div class="upload-grid" id="upload-grid"></div>
    </div>
  </section>
</main>

<footer>
  <p>&copy; 2025 Lens & Layered Designs</p>
  <p>Follow us on <a href="https://instagram.com/lenslayeredDesigns" target="_blank">Instagram</a></p>
</footer>

<!-- Lightbox Modal -->
<div id="lightbox" class="lightbox" style="display: none;">
  <span class="lightbox-close">&times;</span>
  <img class="lightbox-img" src="" alt="Full Preview" />
</div>

<script type="module">
import auth from './services/auth.js';

const backendURL = window.location.hostname.includes('localhost')
  ? 'http://localhost:5000'
  : 'https://lens-backend-production-6f1d.up.railway.app';

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById('logout-btn')?.addEventListener('click', () => {
    auth.logoutUser();
    window.location.href = 'login.html';
  });

  document.getElementById('home-btn')?.addEventListener('click', () => {
    window.location.href = 'home.html';
  });

  document.getElementById('upload-btn')?.addEventListener('click', async (e) => {
    e.preventDefault();
    await uploadImage();
  });

  loadDashboard();
});

async function uploadImage() {
  const token = localStorage.getItem("authToken");
  const fileInput = document.getElementById("uploadInput");
  const file = fileInput?.files?.[0];

  if (!file) {
    alert("Please select an image to upload.");
    return;
  }

  const formData = new FormData();
  formData.append("image", file);

  try {
    const response = await fetch(`${backendURL}/api/user/upload`, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${token}`,
      },
      body: formData
    });

    const data = await response.json();

    if (response.ok) {
      alert("✅ Upload successful!");
      location.reload();
    } else {
      throw new Error(data.error || "Upload failed.");
    }
  } catch (err) {
    console.error("❌ Upload error:", err);
    alert("Upload failed: " + err.message);
  }
}

async function loadDashboard() {
  const token = localStorage.getItem("authToken");

  if (!token) {
    alert("Session expired. Please log in again.");
    window.location.href = "login.html";
    return;
  }

  try {
    const response = await fetch(`${backendURL}/api/user/dashboard`, {
      method: 'GET',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json'
      }
    });

    const contentType = response.headers.get("content-type") || "";

    if (!response.ok) {
      const errorData = contentType.includes("application/json")
        ? await response.json()
        : await response.text();
      throw new Error(errorData.message || `HTTP ${response.status}`);
    }

    const data = await response.json();

    document.getElementById("username").textContent = data.username || "User";
    document.getElementById("uploadCount").textContent = data.uploads?.length || 0;
    document.getElementById("lastLogin").textContent = new Date(data.lastLogin).toLocaleString();

    const grid = document.getElementById("upload-grid");
    grid.innerHTML = "";

    if (Array.isArray(data.uploads)) {
      data.uploads.forEach((src) => {
        const img = document.createElement("img");
        img.src = `${backendURL}${src}`;
        img.alt = "User Upload";
        img.className = "upload-image";
        img.style.borderRadius = "10px";
        img.style.boxShadow = "0 4px 10px rgba(0,0,0,0.2)";
        img.style.width = "100%";
        img.style.height = "auto";
        grid.appendChild(img);
      });
    }
  } catch (err) {
    console.error("❌ Dashboard fetch failed:", err);
    alert("Failed to load dashboard data: " + err.message);
  }
}

// 🔥 Lightbox Logic
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.querySelector('.lightbox-img');
const closeBtn = document.querySelector('.lightbox-close');

document.addEventListener('click', (e) => {
  if (e.target.classList.contains('upload-image')) {
    lightbox.style.display = 'flex';
    lightboxImg.src = e.target.src;
  }
});

closeBtn.addEventListener('click', () => {
  lightbox.style.display = 'none';
});

lightbox.addEventListener('click', (e) => {
  if (e.target === lightbox) {
    lightbox.style.display = 'none';
  }
});

</script>

</body>
</html>
