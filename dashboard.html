<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Dashboard – Lens & Layered Designs</title>
  <link rel="icon" href="logo/lenslogo.png" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/dashboard.css" />
  <style>
    /* Lightbox styles */
    .lightbox {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .lightbox-img {
      max-width: 90%;
      max-height: 85%;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 30px;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header class="site-header">
  <img src="logo/lenslogo.png" alt="Lens&Layered Logo" class="site-logo" />
  <h1 class="site-title">User Dashboard</h1>
  <button class="logout-btn" id="logout-btn">Logout</button>
  <button class="home-btn" id="home-btn">Home</button>
</header>

<main class="dashboard-container">
  <aside class="sidebar">
    <ul>
      <li><a href="#overview" class="active">📊 Overview</a></li>
      <li><a href="#uploads">📁 Uploads</a></li>
      <li><a href="profile.html">👤 Profile</a></li>
      <li><a href="about.html">⚙ Contribute</a></li>
    </ul>
  </aside>

  <section class="dashboard-content">
    <h2>Welcome back, <span id="username">User</span> 👋</h2>

    <div class="dashboard-widgets">
      <div class="upload-form">
        <h3>📤 Upload New Image</h3>
        <input type="file" id="uploadInput" accept="image/*" />
        <button class="logout-btn" id="upload-btn">Upload</button>
      </div>
      <div class="widget">Total Uploads:<strong id="uploadCount">0</strong></div>
      <div class="widget">Followers:<strong id="followerCount">--</strong></div>
      <div class="widget">Last Login:<strong id="lastLogin">--</strong></div>
    </div>

    <div class="dashboard-section" id="uploads">
      <h3>📁 Your Uploads</h3>
      <p>Here's a quick look at your latest photos.</p>
      <div class="upload-grid" id="upload-grid"></div>
    </div>
  </section>
</main>

<footer>
  <p>&copy; 2025 Lens & Layered Designs</p>
  <p>Follow us on <a href="https://instagram.com/lenslayeredDesigns" target="_blank">Instagram</a></p>
</footer>

<!-- Lightbox Modal -->
<div id="lightbox" class="lightbox" style="display: none;">
  <span class="lightbox-close">&times;</span>
  <img class="lightbox-img" src="" alt="Full Preview" />
</div>

<script type="module">
import auth from '/services/auth.js';

const backendURL = 'https://lens-backend-production-6f1d.up.railway.app';

// --- Toast System ---
function showToast(message, type = "success") {
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(() => toast.classList.add('show'), 100);
  setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

// --- Funny Login Fails ---
const funnyLoginErrors = [
  "💀 Wrong password, wrong life.",
  "🤡 You sure that's your account?",
  "🧠 Forgot your own password huh.",
  "🚷 Credentials denied. No entry.",
  "😵‍💫 That ain't it chief."
];
function randomFunnyError() {
  return funnyLoginErrors[Math.floor(Math.random() * funnyLoginErrors.length)];
}

async function validateToken() {
  const token = localStorage.getItem('authToken');
  if (!token) {
    console.warn("🚫 No token found. Redirecting to login...");
    throw new Error('No token found');
  }

  try {
    const response = await fetch(`${backendURL}/api/auth/validate`, {
      method: 'GET',
      headers: { 'Authorization': `Bearer ${token}` }
    });

    if (!response.ok) {
      throw new Error('Invalid token from server');
    }

    console.log("✅ Token valid");
    return true;

  } catch (err) {
    console.error("❌ Token invalid or validation failed:", err);
    localStorage.removeItem('authToken');
    window.location.href = 'login.html';
    throw err;
  }
}


// --- Load Dashboard ---
async function loadUserDashboard() {
  const token = localStorage.getItem('authToken');
  try {
    const response = await fetch(`${backendURL}/api/user/dashboard`, {
      method: 'GET',
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (!response.ok) throw new Error('Failed to load dashboard');

    const data = await response.json();
    console.log("📈 Dashboard data:", data);

    document.getElementById("username").textContent = data.username || "User";
    document.getElementById("uploadCount").textContent = data.uploads?.length || 0;
    document.getElementById("lastLogin").textContent = new Date(data.lastLogin).toLocaleString();

    const grid = document.getElementById("upload-grid");
    grid.innerHTML = "";
    if (data.uploads.length > 0) {
      data.uploads.forEach((src) => {
        const img = document.createElement('img');
        img.src = `${backendURL}${src}`;
        img.alt = "User Upload";
        img.className = "upload-image";
        grid.appendChild(img);
      });
    } else {
      grid.innerHTML = "<p style='color: #aaa; text-align: center;'>No uploads yet. Get started above 👆</p>";
    }
  } catch (err) {
    console.error('Dashboard load error:', err);
    showToast("Failed to load dashboard", "error");
  }
}

// --- Upload Image ---
async function uploadImage() {
  const token = localStorage.getItem('authToken');
  const fileInput = document.getElementById('uploadInput');
  const file = fileInput?.files?.[0];

  if (!file) {
    showToast('⚠️ Please select a file first.', 'error');
    return;
  }

  const formData = new FormData();
  formData.append('image', file);

  try {
    const response = await fetch(`${backendURL}/api/user/upload`, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${token}`
      },
      body: formData
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Upload failed");
    }

    // Update upload count
    const countElem = document.getElementById('uploadCount');
    countElem.textContent = parseInt(countElem.textContent) + 1;

    // Add uploaded image to grid
    const img = document.createElement('img');
    img.src = URL.createObjectURL(file);
    img.alt = "New Upload";
    img.className = "upload-image";

    const grid = document.getElementById("upload-grid");
    grid.prepend(img);

    showToast("✅ Upload successful!", "success");

    fileInput.value = ""; // clear file input

  } catch (err) {
    console.error("Upload error:", err);
    showToast("Upload failed: " + err.message, "error");
  }
}

// --- DOM Ready ---
document.addEventListener('DOMContentLoaded', async () => {
  const isDashboard = document.getElementById('dashboard-page'); // you can add id="dashboard-page" on your dashboard body tag
  const isLoginPage = document.getElementById('login-form');

  if (isDashboard) {
  try {
    await validateToken();         // 🔥 Step 1: validate
    await loadUserDashboard();     // 🔥 Step 2: load dashboard
  } catch (err) {
    console.error('❌ Failed to validate token or load dashboard:', err);
    // No need to manually redirect here — validateToken already handled redirect
  }

  document.getElementById('logout-btn')?.addEventListener('click', () => {
    auth.logoutUser();
    window.location.href = 'login.html';
  });

  document.getElementById('home-btn')?.addEventListener('click', () => {
    window.location.href = 'index.html'; // or whatever your home page is
  });

  document.getElementById('upload-btn')?.addEventListener('click', async (e) => {
    e.preventDefault();
    await uploadImage();
  });
}


  if (isLoginPage) {
    const form = document.getElementById('login-form');
    const loginBtn = document.getElementById('login-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('login-email').value.trim().toLowerCase();
      const password = document.getElementById('login-password').value;

      if (!email || !password) {
        showToast('⚠️ Please enter both email and password.', 'error');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "Logging in...";

      try {
        await auth.loginUser(email, password);
        showToast('✅ Welcome back, king 👑', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 1500);
      } catch (err) {
        console.error(err);
        showToast(randomFunnyError(), 'error');
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = "Log In";
      }
    });
  }
});
</script>

</body>
</html>
